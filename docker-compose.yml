version: "3.8"

services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host # No modo host, o mapeamento de portas abaixo é ignorado
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - VERSION=docker
    volumes:
      - ${BASE_CONFIG_PATH}/plex:/config
      - ${BASE_DATA_PATH}/media:/data/media
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ${BASE_CONFIG_PATH}/prowlarr:/config
    ports:
      - ${PROWLARR_PORT:-9696}:9696
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    ports:
      - ${FLARESOLVERR_PORT:-8191}:8191
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ${BASE_CONFIG_PATH}/radarr:/config
      - ${BASE_DATA_PATH}:/data
    ports:
      - ${RADARR_PORT:-7878}:7878
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ${BASE_CONFIG_PATH}/sonarr:/config
      - ${BASE_DATA_PATH}:/data
    ports:
      - ${SONARR_PORT:-8989}:8989
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - WEBUI_PORT=8080
    volumes:
      - ${BASE_CONFIG_PATH}/qbittorrent:/config
      - ${BASE_DATA_PATH}:/data
    ports:
      - ${QBIT_WEBUI_PORT:-8080}:8080
      - ${QBIT_PORT:-6881}:6881
      - ${QBIT_PORT:-6881}:6881/udp
    restart: unless-stopped
